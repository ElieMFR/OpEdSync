<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OpEdSync</title>
</head>
<body>
<div id="OpEdSyncConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox">
    <style>
        #OpEdSyncConfigPage .ops-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 1em; }
        #OpEdSyncConfigPage .ops-title { display: flex; align-items: center; margin: 0.3em 0; }
        #OpEdSyncConfigPage .ops-title h2 { margin: 0 0.6em 0 0; }
        #OpEdSyncConfigPage .ops-pill { display: inline-block; font-size: 0.8em; padding: 0.25em 0.8em; border-radius: 1em; background: rgba(128, 128, 128, 0.2); }
        #OpEdSyncConfigPage .ops-pill-ok { background: rgba(76, 175, 80, 0.25); }
        #OpEdSyncConfigPage .ops-pill-run { background: rgba(0, 164, 220, 0.3); }
        #OpEdSyncConfigPage .ops-pill-fail { background: rgba(229, 115, 115, 0.3); }
        #OpEdSyncConfigPage .ops-run { margin: 0.3em 0; padding: 0.5em 1.1em; font-size: 0.95em; }
        #OpEdSyncConfigPage .ops-run .material-icons { font-size: 1.3em; vertical-align: middle; margin-right: 0.3em; }
        #OpEdSyncConfigPage .ops-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-gap: 0.8em; margin-bottom: 0.6em; }
        #OpEdSyncConfigPage .ops-card { padding: 0.9em 1em; border-radius: 0.5em; background: rgba(128, 128, 128, 0.12); }
        #OpEdSyncConfigPage .ops-card-label { font-size: 0.85em; opacity: 0.75; margin: 0; display: flex; align-items: center; }
        #OpEdSyncConfigPage .ops-card-label .material-icons { font-size: 1.15em; margin-right: 0.35em; }
        #OpEdSyncConfigPage .ops-card-value { font-size: 1.8em; margin: 0.15em 0; }
        #OpEdSyncConfigPage .ops-card-sub { font-size: 0.85em; opacity: 0.75; margin: 0; }
        #OpEdSyncConfigPage .ops-bar { height: 0.35em; border-radius: 0.2em; background: rgba(128, 128, 128, 0.25); overflow: hidden; margin-top: 0.5em; }
        #OpEdSyncConfigPage .ops-bar > div { height: 100%; background: #00a4dc; width: 0; }
        #OpEdSyncConfigPage .ops-hint { font-size: 0.9em; opacity: 0.75; margin: 0 0 1.2em; }
        #OpEdSyncConfigPage .ops-section { border-radius: 0.5em; background: rgba(128, 128, 128, 0.07); padding: 0.8em 1.2em 0.5em; margin-bottom: 1em; }
        #OpEdSyncConfigPage .ops-section-title { display: flex; align-items: center; font-size: 1.15em; margin: 0.2em 0 0.7em; }
        #OpEdSyncConfigPage .ops-section-title .material-icons { margin-right: 0.45em; opacity: 0.85; }
        #OpEdSyncConfigPage .ops-row { display: flex; justify-content: space-between; align-items: center; padding: 0.45em 0; border-top: 1px solid rgba(128, 128, 128, 0.2); }
        #OpEdSyncConfigPage .ops-row:first-child { border-top: 0; }
        #OpEdSyncConfigPage .ops-row > span:last-child { margin-left: 1em; white-space: nowrap; }
        #OpEdSyncConfigPage .ops-missing { margin: 0.4em 0 0.6em; padding-left: 1.2em; max-height: 18em; overflow-y: auto; }
        #OpEdSyncConfigPage .ops-missing li { margin: 0.15em 0; }
        #OpEdSyncConfigPage .ops-libraries { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-gap: 0 1em; }
        #OpEdSyncConfigPage .ops-libraries .checkboxContainer { margin-bottom: 0.6em; }
        #OpEdSyncConfigPage .ops-count { opacity: 0.6; margin-left: 0.4em; }
        #OpEdSyncConfigPage .ops-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-gap: 0 1.5em; }
        #OpEdSyncConfigPage .ops-muted { opacity: 0.7; }
        #OpEdSyncConfigPage .ops-danger { color: #e57373; }
        #OpEdSyncConfigPage details > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
        #OpEdSyncConfigPage details > summary::-webkit-details-marker { display: none; }
        #OpEdSyncConfigPage details > summary .ops-section-title { margin-bottom: 0.4em; }
        #OpEdSyncConfigPage details > summary:focus { outline: 2px solid #00a4dc; outline-offset: 2px; }
        #OpEdSyncConfigPage .ops-chevron { transition: transform 0.2s; }
        #OpEdSyncConfigPage details[open] .ops-chevron { transform: rotate(90deg); }
        #OpEdSyncConfigPage .ops-volume { display: flex; align-items: center; }
        #OpEdSyncConfigPage .ops-volume input { flex: 1; }
        #OpEdSyncConfigPage .ops-volume output { min-width: 3.5em; text-align: right; margin-left: 0.8em; }
        #OpEdSyncConfigPage .ops-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 1em 1.2em; border-radius: 0.6em; background: rgba(0, 164, 220, 0.08); border: 1px solid rgba(0, 164, 220, 0.25); margin-bottom: 1em; }
        #OpEdSyncConfigPage .ops-brand { display: flex; align-items: center; margin: 0.3em 0; }
        #OpEdSyncConfigPage .ops-logo { width: 2.6em; height: 2.6em; border-radius: 50%; background: rgba(0, 164, 220, 0.2); display: flex; align-items: center; justify-content: center; margin-right: 0.8em; }
        #OpEdSyncConfigPage .ops-logo .material-icons { color: #00a4dc; font-size: 1.5em; }
        #OpEdSyncConfigPage .ops-brand h2 { margin: 0; }
        #OpEdSyncConfigPage .ops-version { display: inline-block; font-size: 0.75em; padding: 0.15em 0.6em; border-radius: 0.3em; background: rgba(128, 128, 128, 0.25); color: inherit; text-decoration: none; margin-right: 0.5em; }
        #OpEdSyncConfigPage .ops-version:focus { outline: 2px solid #00a4dc; }
        #OpEdSyncConfigPage .ops-head-actions { display: flex; align-items: center; flex-wrap: wrap; margin: 0.3em 0; }
        #OpEdSyncConfigPage .ops-link-button { background: none; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 0.3em; color: inherit; padding: 0.45em 0.8em; margin-right: 0.6em; cursor: pointer; font: inherit; font-size: 0.85em; }
        #OpEdSyncConfigPage .ops-link-button:focus { outline: 2px solid #00a4dc; }
        #OpEdSyncConfigPage .ops-state-row { display: flex; align-items: center; padding: 0.55em 0; border-top: 1px solid rgba(128, 128, 128, 0.2); }
        #OpEdSyncConfigPage .ops-state-row:first-child { border-top: 0; }
        #OpEdSyncConfigPage .ops-state-row > .material-icons { margin-right: 0.6em; }
        #OpEdSyncConfigPage .ops-state-text { flex: 1; min-width: 0; }
        #OpEdSyncConfigPage .ops-state-text small { display: block; opacity: 0.7; }
        #OpEdSyncConfigPage .ops-good { color: #66bb6a; }
        #OpEdSyncConfigPage .ops-warn { color: #ffb74d; }
        #OpEdSyncConfigPage .ops-bad { color: #e57373; }
        #OpEdSyncConfigPage .ops-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-gap: 0.8em; }
        #OpEdSyncConfigPage .ops-action { display: flex; align-items: flex-start; text-align: left; padding: 0.9em 1em; border-radius: 0.5em; background: rgba(128, 128, 128, 0.12); border: 1px solid transparent; color: inherit; font: inherit; cursor: pointer; text-decoration: none; }
        #OpEdSyncConfigPage .ops-action:focus { outline: 2px solid #00a4dc; }
        #OpEdSyncConfigPage .ops-action .material-icons { color: #00a4dc; margin-right: 0.6em; }
        #OpEdSyncConfigPage .ops-action b { display: block; font-weight: 600; }
        #OpEdSyncConfigPage .ops-action small { display: block; opacity: 0.7; margin-top: 0.2em; }
        #OpEdSyncConfigPage .ops-lib-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: 0.6em 0; }
        #OpEdSyncConfigPage .ops-lib-filter { flex: 1 1 14em; margin: 0.3em 0.8em 0.3em 0; padding: 0.55em 0.8em; border-radius: 0.3em; border: 1px solid rgba(128, 128, 128, 0.35); background: rgba(0, 0, 0, 0.15); color: inherit; font: inherit; }
        #OpEdSyncConfigPage .ops-lib-count { opacity: 0.75; margin-right: 0.8em; }
        #OpEdSyncConfigPage .ops-lib-list { border-radius: 0.4em; background: rgba(0, 0, 0, 0.12); padding: 0.3em 0.8em; max-height: 22em; overflow-y: auto; }
        #OpEdSyncConfigPage .ops-lib-row { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(128, 128, 128, 0.15); }
        #OpEdSyncConfigPage .ops-lib-row:first-child { border-top: 0; }
        #OpEdSyncConfigPage .ops-lib-row .checkboxContainer { margin: 0.35em 0; }
        #OpEdSyncConfigPage .ops-lib-type { font-size: 0.8em; opacity: 0.6; margin-left: 1em; white-space: nowrap; }
        #OpEdSyncConfigPage .ops-savebar { position: -webkit-sticky; position: sticky; bottom: 0; padding: 0.8em 0; background: linear-gradient(rgba(16, 16, 16, 0), rgba(16, 16, 16, 0.92) 35%); }
        #OpEdSyncConfigPage.ops-no-help .fieldDescription, #OpEdSyncConfigPage.ops-no-help .ops-hint, #OpEdSyncConfigPage.ops-no-help .ops-action small { display: none; }
        @media (max-width: 1100px) {
            #OpEdSyncConfigPage .ops-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            #OpEdSyncConfigPage .ops-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            #OpEdSyncConfigPage .ops-libraries { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            #OpEdSyncConfigPage .ops-grid { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 560px) {
            #OpEdSyncConfigPage .ops-cards, #OpEdSyncConfigPage .ops-libraries, #OpEdSyncConfigPage .ops-actions { grid-template-columns: minmax(0, 1fr); }
        }
        @media (prefers-reduced-motion: reduce) {
            #OpEdSyncConfigPage .ops-chevron { transition: none; }
        }
    </style>

    <div data-role="content">
        <div class="content-primary">
            <div class="ops-header">
                <div class="ops-brand">
                    <div class="ops-logo"><span class="material-icons library_music" aria-hidden="true"></span></div>
                    <div>
                        <h2>OpEdSync</h2>
                        <div><a id="opsVersion" class="ops-version" href="https://github.com/ElieMFR/OpEdSync/releases" target="_blank" rel="noopener">…</a><span id="opsTaskState" class="ops-pill">…</span></div>
                    </div>
                </div>
                <div class="ops-head-actions">
                    <button type="button" id="opsHelpToggle" class="ops-link-button"></button>
                    <button is="emby-button" type="button" id="opsRun" class="raised emby-button ops-run">
                        <span class="material-icons play_arrow" aria-hidden="true"></span><span id="opsRunLabel" data-ops-t="runNow"></span>
                    </button>
                </div>
            </div>

            <div class="ops-cards">
                <div class="ops-card">
                    <p class="ops-card-label"><span class="material-icons library_music" aria-hidden="true"></span><span data-ops-t="coverage"></span></p>
                    <p class="ops-card-value" id="opsCoverage">…</p>
                    <p class="ops-card-sub" id="opsCoverageSub"></p>
                    <div class="ops-bar"><div id="opsCoverageBar"></div></div>
                </div>
                <div class="ops-card">
                    <p class="ops-card-label"><span class="material-icons music_off" aria-hidden="true"></span><span data-ops-t="withoutTheme"></span></p>
                    <p class="ops-card-value" id="opsMissing">…</p>
                    <p class="ops-card-sub" id="opsMissingSub"></p>
                </div>
                <div class="ops-card">
                    <p class="ops-card-label"><span class="material-icons history" aria-hidden="true"></span><span data-ops-t="lastRun"></span></p>
                    <p class="ops-card-value" id="opsLastAdded">…</p>
                    <p class="ops-card-sub" id="opsLastRunSub"></p>
                </div>
                <div class="ops-card">
                    <p class="ops-card-label"><span class="material-icons schedule" aria-hidden="true"></span><span data-ops-t="nextRun"></span></p>
                    <p class="ops-card-value" id="opsNextRun">…</p>
                    <p class="ops-card-sub" id="opsNextRunSub"></p>
                </div>
            </div>
            <p class="ops-hint" data-ops-t="profileHint"></p>

            <div class="ops-section" id="opsReasonsSection">
                <div class="ops-section-title"><span class="material-icons help_outline" aria-hidden="true"></span><span id="opsReasonsTitle"></span></div>
                <div id="opsReasons"><p class="ops-muted">…</p></div>
                <details id="opsMissingDetails" style="display: none;">
                    <summary><span data-ops-t="showList"></span><span class="material-icons chevron_right ops-chevron" aria-hidden="true"></span></summary>
                    <ul class="ops-missing" id="opsMissingList"></ul>
                </details>
            </div>

            <div class="ops-section">
                <div class="ops-section-title"><span class="material-icons fact_check" aria-hidden="true"></span><span data-ops-t="state"></span></div>
                <div id="opsState"><p class="ops-muted" data-ops-t="checking"></p></div>
            </div>

            <div class="ops-section">
                <div class="ops-section-title"><span class="material-icons bolt" aria-hidden="true"></span><span data-ops-t="actions"></span></div>
                <div class="ops-actions">
                    <button type="button" class="ops-action" id="opsActionRun"><span class="material-icons play_arrow" aria-hidden="true"></span><span><b data-ops-t="actRun"></b><small data-ops-t="actRunHelp"></small></span></button>
                    <button type="button" class="ops-action" id="opsActionRefresh"><span class="material-icons refresh" aria-hidden="true"></span><span><b data-ops-t="actRefresh"></b><small data-ops-t="actRefreshHelp"></small></span></button>
                    <button type="button" class="ops-action" id="opsActionCheck"><span class="material-icons wifi_tethering" aria-hidden="true"></span><span><b data-ops-t="actCheck"></b><small data-ops-t="actCheckHelp"></small></span></button>
                    <a class="ops-action" href="#/dashboard/logs"><span class="material-icons article" aria-hidden="true"></span><span><b data-ops-t="actLogs"></b><small data-ops-t="actLogsHelp"></small></span></a>
                </div>
            </div>

            <form id="OpEdSyncConfigForm">
                <div class="ops-section">
                    <div class="ops-section-title"><span class="material-icons video_library" aria-hidden="true"></span><span data-ops-t="libraries"></span></div>
                    <div class="fieldDescription" data-ops-t="librariesHelp" style="margin-bottom: 0.8em;"></div>
                    <div class="ops-lib-tools">
                        <input type="search" id="opsLibFilter" class="ops-lib-filter" autocomplete="off"/>
                        <span><span class="ops-lib-count" id="opsLibCount"></span><button type="button" class="ops-link-button" id="opsLibAll" data-ops-t="selectAll"></button><button type="button" class="ops-link-button" id="opsLibNone" data-ops-t="selectNone"></button></span>
                    </div>
                    <div class="ops-lib-list" id="opsLibraries"><p class="ops-muted">…</p></div>
                </div>

                <div class="ops-section">
                    <div class="ops-section-title"><span class="material-icons library_music" aria-hidden="true"></span><span data-ops-t="music"></span></div>
                    <div class="ops-grid">
                        <div class="selectContainer">
                            <label class="selectLabel" for="opsAudioFetch" data-ops-t="themesToKeep"></label>
                            <select is="emby-select" id="opsAudioFetch">
                                <option value="Single" data-ops-t="fetchSingle"></option>
                                <option value="All" data-ops-t="fetchAll"></option>
                                <option value="None" data-ops-t="fetchNone"></option>
                            </select>
                        </div>
                        <div class="selectContainer">
                            <label class="selectLabel" for="opsThemeSource" data-ops-t="seriesUse"></label>
                            <select is="emby-select" id="opsThemeSource">
                                <option value="LatestSeason" data-ops-t="latestSeason"></option>
                                <option value="Series" data-ops-t="firstSeason"></option>
                            </select>
                            <div class="fieldDescription" data-ops-t="seriesUseHelp"></div>
                        </div>
                        <div class="selectContainer">
                            <label class="selectLabel" for="opsThemeTypes" data-ops-t="themeTypes"></label>
                            <select is="emby-select" id="opsThemeTypes">
                                <option value="both" data-ops-t="typesBoth"></option>
                                <option value="op" data-ops-t="typesOp"></option>
                                <option value="ed" data-ops-t="typesEd"></option>
                            </select>
                        </div>
                        <div class="selectContainer">
                            <label class="selectLabel" for="opsAudioOverlap" data-ops-t="overlap"></label>
                            <select is="emby-select" id="opsAudioOverlap">
                                <option value="transitions" data-ops-t="overlapTransitions"></option>
                                <option value="strict" data-ops-t="overlapStrict"></option>
                                <option value="all" data-ops-t="overlapAll"></option>
                            </select>
                            <div class="fieldDescription" data-ops-t="overlapHelp"></div>
                        </div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="opsAudioVolume" data-ops-t="volume"></label>
                        <div class="ops-volume">
                            <input id="opsAudioVolume" type="range" min="0" max="100" step="5"/>
                            <output id="opsAudioVolumeOut"></output>
                        </div>
                        <div class="fieldDescription" data-ops-t="volumeHelp"></div>
                    </div>
                </div>

                <div class="ops-section">
                    <details id="opsVideoDetails">
                        <summary>
                            <span class="ops-section-title"><span class="material-icons movie" aria-hidden="true"></span><span data-ops-t="video"></span></span>
                            <span><span id="opsVideoState" class="ops-pill"></span><span class="material-icons chevron_right ops-chevron" aria-hidden="true" style="vertical-align: middle;"></span></span>
                        </summary>
                        <div class="fieldDescription" data-ops-t="videoHelp" style="margin-bottom: 0.8em;"></div>
                        <div class="ops-grid">
                            <div class="selectContainer">
                                <label class="selectLabel" for="opsVideoFetch" data-ops-t="themesToKeep"></label>
                                <select is="emby-select" id="opsVideoFetch">
                                    <option value="None" data-ops-t="fetchNone"></option>
                                    <option value="Single" data-ops-t="fetchSingle"></option>
                                    <option value="All" data-ops-t="fetchAll"></option>
                                </select>
                            </div>
                            <div class="selectContainer">
                                <label class="selectLabel" for="opsVideoOverlap" data-ops-t="overlap"></label>
                                <select is="emby-select" id="opsVideoOverlap">
                                    <option value="transitions" data-ops-t="overlapTransitions"></option>
                                    <option value="strict" data-ops-t="overlapStrict"></option>
                                    <option value="all" data-ops-t="overlapAll"></option>
                                </select>
                            </div>
                        </div>
                        <div class="checkboxContainer">
                            <label class="emby-checkbox-label">
                                <input id="opsVideoCredits" type="checkbox" is="emby-checkbox"/>
                                <span data-ops-t="noCredits"></span>
                            </label>
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="opsVideoVolume" data-ops-t="volume"></label>
                            <div class="ops-volume">
                                <input id="opsVideoVolume" type="range" min="0" max="100" step="5"/>
                                <output id="opsVideoVolumeOut"></output>
                            </div>
                            <div class="fieldDescription" data-ops-t="videoVolumeHelp"></div>
                        </div>
                    </details>
                </div>

                <div class="ops-section">
                    <div class="ops-section-title"><span class="material-icons tune" aria-hidden="true"></span><span data-ops-t="advanced"></span></div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="opsCheckYear" type="checkbox" is="emby-checkbox"/>
                            <span data-ops-t="checkYear"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-ops-t="checkYearHelp"></div>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="opsParallelism" data-ops-t="parallelism"></label>
                        <select is="emby-select" id="opsParallelism">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                        <div class="fieldDescription" data-ops-t="parallelismHelp"></div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="opsForceSync" type="checkbox" is="emby-checkbox"/>
                            <span class="ops-danger" data-ops-t="forceSync"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-ops-t="forceSyncHelp"></div>
                    </div>
                </div>

                <div class="ops-savebar">
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span data-ops-t="save"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

            // Jellyfin sets <html lang> to the display language: French texts for French, English for every other language.
            var lang = (document.documentElement.getAttribute('lang') || navigator.language || 'en').toLowerCase();
            var isFrench = lang === 'fr' || lang.indexOf('fr-') === 0;
            var t = isFrench ? texts.fr : texts.en;
            var locale = isFrench ? 'fr-FR' : 'en';

            var config = null;
            var task = null;
            var pollTimer = null;

            function $(selector) {
                return page.querySelector(selector);
            }

            function format(text) {
                var args = arguments;
                return text.replace(/\{(\d)\}/g, function (match, index) {
                    return args[Number(index) + 1];
                });
            }

            function number(value) {
                return Number(value || 0).toLocaleString(locale);
            }

            function plural(count, zero, one, many) {
                return count === 0 ? zero : (count === 1 ? one : format(many, number(count)));
            }

            function escapeHtml(value) {
                var div = document.createElement('div');
                div.textContent = value == null ? '' : String(value);
                return div.innerHTML;
            }

            function duration(ms) {
                var minutes = Math.max(1, Math.round(ms / 60000));
                if (minutes < 60) {
                    return format(t.unit_m, minutes);
                }

                var hours = Math.round(minutes / 60);
                return hours < 48 ? format(t.unit_h, hours) : format(t.unit_d, Math.round(hours / 24));
            }

            function capitalize(text) {
                return text ? text.charAt(0).toUpperCase() + text.slice(1) : text;
            }

            function since(date) {
                var ms = Date.now() - date.getTime();
                return ms < 60000 ? t.justNow : format(t.ago, duration(ms));
            }

            function clock(date) {
                return date.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
            }

            function dayLabel(date) {
                var today = new Date();
                var tomorrow = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
                if (date.toDateString() === today.toDateString()) {
                    return t.today;
                }

                if (date.toDateString() === tomorrow.toDateString()) {
                    return t.tomorrow;
                }

                return date.toLocaleDateString(locale, { weekday: 'long' });
            }

            function translatePage() {
                var nodes = page.querySelectorAll('[data-ops-t]');
                for (var i = 0; i < nodes.length; i++) {
                    var key = nodes[i].getAttribute('data-ops-t');
                    if (t[key] !== undefined) {
                        nodes[i].textContent = t[key];
                    }
                }
            }

            function overlapValue(settings) {
                if (!settings.IgnoreOverlapping) {
                    return 'all';
                }

                return settings.AllowTransitions === false ? 'strict' : 'transitions';
            }

            function applyOverlap(settings, value) {
                settings.IgnoreOverlapping = value !== 'all';
                settings.AllowTransitions = value !== 'strict';
            }

            function showVolume(input, output) {
                output.textContent = input.value + ' %';
            }

            function writeForm() {
                var audio = config.AudioSettings;
                var video = config.VideoSettings;

                $('#opsAudioFetch').value = audio.FetchType;
                $('#opsThemeSource').value = config.ThemeSource || 'LatestSeason';
                $('#opsThemeTypes').value = audio.IgnoreEDs ? 'op' : (audio.IgnoreOPs ? 'ed' : 'both');
                $('#opsAudioOverlap').value = overlapValue(audio);
                $('#opsAudioVolume').value = Math.round((audio.Volume || 0) * 100);
                showVolume($('#opsAudioVolume'), $('#opsAudioVolumeOut'));

                $('#opsVideoFetch').value = video.FetchType;
                $('#opsVideoOverlap').value = overlapValue(video);
                $('#opsVideoCredits').checked = !!video.IgnoreThemesWithCredits;
                $('#opsVideoVolume').value = Math.round((video.Volume || 0) * 100);
                showVolume($('#opsVideoVolume'), $('#opsVideoVolumeOut'));
                showVideoState(video.FetchType);

                $('#opsCheckYear').checked = config.CheckYear !== false;
                $('#opsParallelism').value = String(Math.min(4, Math.max(1, parseInt(config.DegreeOfParallelism, 10) || 1)));
                $('#opsForceSync').checked = !!config.ForceSync;
            }

            function showVideoState(fetchType) {
                var state = $('#opsVideoState');
                state.textContent = fetchType === 'None' ? t.off : t.on;
                state.className = 'ops-pill' + (fetchType === 'None' ? '' : ' ops-pill-ok');
            }

            function readForm() {
                var audio = config.AudioSettings;
                var video = config.VideoSettings;
                var types = $('#opsThemeTypes').value;

                audio.FetchType = $('#opsAudioFetch').value;
                audio.IgnoreOPs = video.IgnoreOPs = types === 'ed';
                audio.IgnoreEDs = video.IgnoreEDs = types === 'op';
                applyOverlap(audio, $('#opsAudioOverlap').value);
                audio.Volume = parseInt($('#opsAudioVolume').value, 10) / 100;

                video.FetchType = $('#opsVideoFetch').value;
                applyOverlap(video, $('#opsVideoOverlap').value);
                video.IgnoreThemesWithCredits = $('#opsVideoCredits').checked;
                video.Volume = parseInt($('#opsVideoVolume').value, 10) / 100;

                config.ThemeSource = $('#opsThemeSource').value;
                config.CheckYear = $('#opsCheckYear').checked;
                config.DegreeOfParallelism = parseInt($('#opsParallelism').value, 10);
                config.ForceSync = $('#opsForceSync').checked;

                // Libraries are only known once the figures arrived; until then, keep the saved choice.
                var boxes = page.querySelectorAll('#opsLibraries input[type=checkbox]');
                if (boxes.length) {
                    var ids = [];
                    for (var i = 0; i < boxes.length; i++) {
                        if (boxes[i].checked) {
                            ids.push(boxes[i].getAttribute('data-id'));
                        }
                    }

                    config.UseLibraryList = true;
                    config.LibraryIds = ids;
                }
            }

            function renderLibraries(libraries) {
                var html = '';
                for (var i = 0; i < libraries.length; i++) {
                    var library = libraries[i];
                    html += '<div class="ops-lib-row" data-name="' + escapeHtml(String(library.Name).toLowerCase()) + '">'
                        + '<div class="checkboxContainer"><label class="emby-checkbox-label">'
                        + '<input type="checkbox" is="emby-checkbox" data-id="' + escapeHtml(library.Id) + '"' + (library.Included ? ' checked' : '') + '/>'
                        + '<span>' + escapeHtml(library.Name) + '<span class="ops-count">' + number(library.ItemCount) + '</span></span></label></div>'
                        + '<span class="ops-lib-type">' + escapeHtml(library.CollectionType || '') + '</span></div>';
                }

                $('#opsLibraries').innerHTML = html;
                var boxes = page.querySelectorAll('#opsLibraries input[type=checkbox]');
                for (var j = 0; j < boxes.length; j++) {
                    boxes[j].addEventListener('change', updateLibraryCount);
                }

                applyLibraryFilter();
                updateLibraryCount();
            }

            function updateLibraryCount() {
                var boxes = page.querySelectorAll('#opsLibraries input[type=checkbox]');
                var checked = 0;
                for (var i = 0; i < boxes.length; i++) {
                    checked += boxes[i].checked ? 1 : 0;
                }

                $('#opsLibCount').textContent = format(t.selected, checked, boxes.length);
            }

            function applyLibraryFilter() {
                var text = $('#opsLibFilter').value.trim().toLowerCase();
                var rows = page.querySelectorAll('#opsLibraries .ops-lib-row');
                for (var i = 0; i < rows.length; i++) {
                    rows[i].style.display = !text || rows[i].getAttribute('data-name').indexOf(text) !== -1 ? '' : 'none';
                }
            }

            // "Tick all" only touches the libraries the filter shows.
            function tickLibraries(value) {
                var rows = page.querySelectorAll('#opsLibraries .ops-lib-row');
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].style.display !== 'none') {
                        rows[i].querySelector('input[type=checkbox]').checked = value;
                    }
                }

                updateLibraryCount();
            }

            function icon(name, cls) {
                return '<span class="material-icons ' + name + ' ' + cls + '" aria-hidden="true"></span>';
            }

            function stateRow(ok, level, title, sub) {
                var iconName = ok ? 'check_circle' : (level === 'bad' ? 'error_outline' : 'warning_amber');
                var cls = ok ? 'ops-good' : (level === 'bad' ? 'ops-bad' : 'ops-warn');
                return '<div class="ops-state-row">' + icon(iconName, cls) + '<div class="ops-state-text">' + escapeHtml(title)
                    + (sub ? '<small>' + escapeHtml(sub) + '</small>' : '') + '</div></div>';
            }

            function renderStatus(status) {
                var version = $('#opsVersion');
                version.textContent = status.Version || '…';
                version.title = t.releaseNotes;
                if (status.Version) {
                    version.href = 'https://github.com/ElieMFR/OpEdSync/releases/tag/' + encodeURIComponent(status.Version);
                }

                var rows = '';
                var check = status.AnimeThemes;
                if (check) {
                    var when = since(new Date(check.CheckedUtc));
                    rows += check.Reachable
                        ? stateRow(true, null, t.atOk, format(t.atSub, number(check.LatencyMs), when))
                        : stateRow(false, 'bad', t.atKo, format(t.atKoSub, check.Error === 'timeout' ? t.timeout : (check.Error || ('HTTP ' + check.StatusCode)), when));
                }

                var providers = [];
                var fileTransformation = null;
                var deps = status.Dependencies || [];
                for (var i = 0; i < deps.length; i++) {
                    if (deps[i].Role === 'Ids' && deps[i].Installed && deps[i].Active) {
                        providers.push(deps[i].Name + (deps[i].Version ? ' ' + deps[i].Version : ''));
                    } else if (deps[i].Role === 'AndroidFix') {
                        fileTransformation = deps[i];
                    }
                }

                rows += providers.length
                    ? stateRow(true, null, t.idsOk, format(t.idsOkSub, providers.join(', ')))
                    : stateRow(false, 'bad', t.idsKo, t.idsKoSub);

                if (status.AndroidFixActive) {
                    rows += stateRow(true, null, t.ftOk, format(t.ftOkSub, fileTransformation && fileTransformation.Version ? fileTransformation.Version : ''));
                } else if (fileTransformation && fileTransformation.Installed) {
                    rows += stateRow(false, 'warn', t.ftRestart, t.ftRestartSub);
                } else {
                    rows += stateRow(false, 'warn', t.ftKo, t.ftKoSub);
                }

                $('#opsState').innerHTML = rows;
            }

            function loadStatus(recheck) {
                return ApiClient.getJSON(ApiClient.getUrl('OpEdSync/Status', recheck ? { recheck: true } : {})).then(renderStatus);
            }

            // Per-viewer convenience: remember whether the help texts are hidden.
            function readHelpPreference() {
                try {
                    return localStorage.getItem('opedsync-help') !== 'off';
                } catch (e) {
                    return true;
                }
            }

            function showHelp(visible) {
                page.classList.toggle('ops-no-help', !visible);
                $('#opsHelpToggle').textContent = visible ? t.helpOn : t.helpOff;
                try {
                    localStorage.setItem('opedsync-help', visible ? 'on' : 'off');
                } catch (e) {
                    // Storage may be unavailable (private window): the choice just won't be remembered.
                }
            }

            function renderStats(stats) {
                var anyLibrary = false;
                for (var k = 0; k < (stats.Libraries || []).length; k++) {
                    anyLibrary = anyLibrary || stats.Libraries[k].Included;
                }

                var total = stats.Total || 0;
                var withTheme = stats.WithTheme || 0;
                var missing = total - withTheme;
                var percent = total ? Math.round(withTheme / total * 100) : 0;

                $('#opsCoverage').textContent = total ? percent + ' %' : '—';
                $('#opsCoverageSub').textContent = !anyLibrary ? '' : format(t.coverageSub, number(withTheme), number(total))
                    + (stats.FromPlugin ? ' ' + format(t.fromPlugin, number(stats.FromPlugin)) : '');
                $('#opsCoverageBar').style.width = percent + '%';
                $('#opsMissing').textContent = anyLibrary ? number(missing) : '—';
                $('#opsMissingSub').textContent = !anyLibrary ? t.noLibrarySub : (missing ? t.missingSub : t.missingNone);

                var run = stats.LastRun;
                if (run) {
                    $('#opsLastAdded').textContent = plural(run.Added, t.added0, t.added1, t.addedN);
                    $('#opsLastRunSub').textContent = capitalize(since(new Date(run.EndedUtc)))
                        + ', ' + plural(run.Failed, t.failed0, t.failed1, t.failedN) + '.' + (run.Cancelled ? ' ' + t.cancelled : '');
                } else {
                    $('#opsLastAdded').textContent = '—';
                    $('#opsLastRunSub').textContent = t.never;
                }

                $('#opsReasonsTitle').textContent = !anyLibrary ? t.noLibrary : missing === 0 ? t.reasonsTitleNone
                    : (missing === 1 ? t.reasonsTitleOne : format(t.reasonsTitle, number(missing)));

                var reasons = stats.Reasons || {};
                var order = ['NoId', 'NotOnAnimeThemes', 'NoVideo', 'YearMismatch', 'Filtered', 'DownloadFailed', 'LookupFailed', 'NotAnalysed'];
                var rows = '';
                for (var i = 0; i < order.length; i++) {
                    if (reasons[order[i]]) {
                        rows += '<div class="ops-row"><span>' + escapeHtml(t.reasons[order[i]]) + '</span><span>' + number(reasons[order[i]]) + '</span></div>';
                    }
                }

                if (!anyLibrary) {
                    rows = '<p class="ops-danger">' + escapeHtml(t.noLibraryHelp) + '</p>';
                }

                $('#opsReasons').innerHTML = rows;

                var list = '';
                var items = stats.Missing || [];
                for (var j = 0; j < items.length; j++) {
                    list += '<li>' + escapeHtml(items[j].Name) + (items[j].Year ? ' (' + items[j].Year + ')' : '')
                        + ' <span class="ops-muted">· ' + escapeHtml(t.reasons[items[j].Reason] || items[j].Reason) + '</span></li>';
                }

                $('#opsMissingList').innerHTML = list;
                $('#opsMissingDetails').style.display = items.length ? '' : 'none';
            }

            // Earliest next start among the task triggers. Daily and weekly times are read in the browser's time
            // zone, which is the server's in the usual setup.
            function nextTrigger(triggers, last) {
                var now = new Date();
                var best = null;
                var label = null;
                var startup = false;

                for (var i = 0; i < triggers.length; i++) {
                    var trigger = triggers[i];
                    var next = null;
                    if (trigger.Type === 'IntervalTrigger' && trigger.IntervalTicks) {
                        var interval = trigger.IntervalTicks / 10000;
                        var from = last && last.EndTimeUtc ? new Date(last.EndTimeUtc).getTime() : now.getTime();
                        next = new Date(Math.max(from + interval, now.getTime()));
                        label = format(t.every, duration(interval));
                    } else if (trigger.Type === 'DailyTrigger' || trigger.Type === 'WeeklyTrigger') {
                        var minutes = Math.round((trigger.TimeOfDayTicks || 0) / 600000000);
                        next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Math.floor(minutes / 60), minutes % 60);
                        if (trigger.Type === 'WeeklyTrigger') {
                            var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                            var target = days.indexOf(trigger.DayOfWeek);
                            var shift = target < 0 ? 0 : (target - next.getDay() + 7) % 7;
                            next.setDate(next.getDate() + shift);
                            if (next <= now) {
                                next.setDate(next.getDate() + 7);
                            }
                        } else if (next <= now) {
                            next.setDate(next.getDate() + 1);
                        }

                        label = trigger.Type === 'DailyTrigger' ? t.daily : t.weekly;
                    } else if (trigger.Type === 'StartupTrigger') {
                        startup = true;
                    }

                    if (next && (!best || next < best)) {
                        best = next;
                    }
                }

                return { next: best, label: label, startup: startup };
            }

            function renderTask() {
                var state = $('#opsTaskState');
                if (!task) {
                    state.textContent = '—';
                    return;
                }

                var running = task.State === 'Running';
                var progress = Math.round(task.CurrentProgressPercentage || 0);
                var failed = !running && task.LastExecutionResult && task.LastExecutionResult.Status === 'Failed';
                state.textContent = running ? t.running + ' · ' + progress + ' %' : (failed ? t.lastFailed : t.ready);
                state.className = 'ops-pill ' + (running ? 'ops-pill-run' : (failed ? 'ops-pill-fail' : 'ops-pill-ok'));
                $('#opsRunLabel').textContent = running ? t.running + ' · ' + progress + ' %' : t.runNow;

                var schedule = nextTrigger(task.Triggers || [], task.LastExecutionResult);
                if (running) {
                    $('#opsNextRun').textContent = progress + ' %';
                    $('#opsNextRunSub').textContent = t.running_sub;
                } else if (schedule.next) {
                    var remaining = schedule.next.getTime() - Date.now();
                    $('#opsNextRun').textContent = remaining > 60000 ? format(t.at, clock(schedule.next)) : t.soon;
                    $('#opsNextRunSub').textContent = format(t.nextSentence, capitalize(dayLabel(schedule.next)), schedule.label);
                } else if (schedule.startup) {
                    $('#opsNextRun').textContent = t.startup;
                    $('#opsNextRunSub').textContent = t.startupSub;
                } else {
                    $('#opsNextRun').textContent = t.manual;
                    $('#opsNextRunSub').textContent = t.manualSub;
                }
            }

            function loadTask() {
                return ApiClient.getScheduledTasks({ isHidden: false }).then(function (tasks) {
                    task = null;
                    for (var i = 0; i < tasks.length; i++) {
                        if (tasks[i].Key === taskKey) {
                            task = tasks[i];
                        }
                    }

                    renderTask();
                    return task;
                });
            }

            function loadStats(refresh) {
                return ApiClient.getJSON(ApiClient.getUrl('OpEdSync/Stats', refresh ? { refresh: true } : {})).then(function (stats) {
                    renderLibraries(stats.Libraries || []);
                    renderStats(stats);
                });
            }

            // While the task runs, follow its progress, then refresh the figures once it ends.
            function watchTask() {
                if (pollTimer) {
                    return;
                }

                pollTimer = setInterval(function () {
                    loadTask().then(function (current) {
                        if (!current || current.State !== 'Running') {
                            clearInterval(pollTimer);
                            pollTimer = null;
                            loadStats(true);
                        }
                    });
                }, 3000);
            }

            page.addEventListener('pageshow', function () {
                translatePage();
                $('#opsLibFilter').placeholder = t.filter;
                showHelp(readHelpPreference());
                loadStatus(false).catch(function (e) {
                    console.error('OpEdSync: status failed to load', e);
                });
                Dashboard.showLoadingMsg();

                // The settings show at once; the figures take about a second and fill in when they arrive.
                ApiClient.getPluginConfiguration(pluginId).then(function (result) {
                    config = result;
                    writeForm();
                }).catch(function (e) {
                    console.error('OpEdSync: settings failed to load', e);
                }).then(function () {
                    Dashboard.hideLoadingMsg();
                });

                loadTask().then(function (current) {
                    if (current && current.State === 'Running') {
                        watchTask();
                    }
                }).catch(function (e) {
                    console.error('OpEdSync: task failed to load', e);
                });

                loadStats(false).catch(function (e) {
                    console.error('OpEdSync: figures failed to load', e);
                });
            });

            page.addEventListener('pagehide', function () {
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
            });

            $('#opsAudioVolume').addEventListener('input', function () {
                showVolume(this, $('#opsAudioVolumeOut'));
            });

            $('#opsVideoVolume').addEventListener('input', function () {
                showVolume(this, $('#opsVideoVolumeOut'));
            });

            $('#opsVideoFetch').addEventListener('change', function () {
                showVideoState(this.value);
            });

            function startTask() {
                if (!task || task.State === 'Running') {
                    return;
                }

                ApiClient.startScheduledTask(task.Id).then(function () {
                    task.State = 'Running';
                    task.CurrentProgressPercentage = 0;
                    renderTask();
                    watchTask();
                });
            }

            $('#opsRun').addEventListener('click', startTask);
            $('#opsActionRun').addEventListener('click', startTask);

            $('#opsActionRefresh').addEventListener('click', function () {
                $('#opsCoverage').textContent = '…';
                loadStats(true);
            });

            $('#opsActionCheck').addEventListener('click', function () {
                $('#opsState').innerHTML = '<p class="ops-muted">' + escapeHtml(t.checking) + '</p>';
                loadStatus(true);
            });

            $('#opsLibFilter').addEventListener('input', applyLibraryFilter);
            $('#opsLibAll').addEventListener('click', function () { tickLibraries(true); });
            $('#opsLibNone').addEventListener('click', function () { tickLibraries(false); });

            $('#opsHelpToggle').addEventListener('click', function () {
                showHelp(page.classList.contains('ops-no-help'));
            });

            $('#OpEdSyncConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                if (!config) {
                    return false;
                }

                Dashboard.showLoadingMsg();
                readForm();
                ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                    return loadStats(true);
                });
                return false;
            });
        })();
    </script>
</div>
</body>
</html>
