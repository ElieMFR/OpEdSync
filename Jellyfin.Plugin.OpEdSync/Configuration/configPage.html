<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OpEdSync</title>
</head>
<body>
<div id="OpEdSyncConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox">
    <style>
        #OpEdSyncConfigPage .ops-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 1em; }
        #OpEdSyncConfigPage .ops-head h2 { margin: 0 1em 0 0; }
        #OpEdSyncConfigPage .ops-badge { display: inline-block; font-size: 0.8em; padding: 0.2em 0.7em; border-radius: 0.3em; margin-left: 0.6em; background: rgba(128, 128, 128, 0.2); vertical-align: middle; }
        #OpEdSyncConfigPage .ops-badge.ops-running { background: rgba(0, 164, 220, 0.25); }
        #OpEdSyncConfigPage .ops-cards { display: flex; flex-wrap: wrap; margin: 0 -0.4em 1em; }
        #OpEdSyncConfigPage .ops-card { flex: 1 1 10em; margin: 0.4em; padding: 0.9em 1em; border-radius: 0.5em; background: rgba(128, 128, 128, 0.12); }
        #OpEdSyncConfigPage .ops-card-label { font-size: 0.85em; opacity: 0.75; margin: 0; }
        #OpEdSyncConfigPage .ops-card-value { font-size: 1.8em; margin: 0.15em 0; }
        #OpEdSyncConfigPage .ops-card-sub { font-size: 0.85em; opacity: 0.75; margin: 0; }
        #OpEdSyncConfigPage .ops-bar { height: 0.35em; border-radius: 0.2em; background: rgba(128, 128, 128, 0.25); overflow: hidden; margin-top: 0.4em; }
        #OpEdSyncConfigPage .ops-bar > div { height: 100%; background: #00a4dc; width: 0; }
        #OpEdSyncConfigPage .ops-section { border-radius: 0.5em; background: rgba(128, 128, 128, 0.07); padding: 0.8em 1.2em 0.4em; margin-bottom: 1em; }
        #OpEdSyncConfigPage .ops-section h3 { margin: 0.2em 0 0.6em; }
        #OpEdSyncConfigPage .ops-row { display: flex; justify-content: space-between; align-items: center; padding: 0.45em 0; border-top: 1px solid rgba(128, 128, 128, 0.2); }
        #OpEdSyncConfigPage .ops-row:first-child { border-top: 0; }
        #OpEdSyncConfigPage .ops-row > span:last-child { margin-left: 1em; white-space: nowrap; }
        #OpEdSyncConfigPage .ops-missing { margin: 0.4em 0 0.6em; padding-left: 1.2em; max-height: 18em; overflow-y: auto; }
        #OpEdSyncConfigPage .ops-missing li { margin: 0.15em 0; }
        #OpEdSyncConfigPage .ops-muted { opacity: 0.7; }
        #OpEdSyncConfigPage .ops-danger { color: #e57373; }
        #OpEdSyncConfigPage details > summary { cursor: pointer; padding: 0.3em 0; }
        #OpEdSyncConfigPage .ops-volume { display: flex; align-items: center; }
        #OpEdSyncConfigPage .ops-volume input { flex: 1; }
        #OpEdSyncConfigPage .ops-volume output { min-width: 3.5em; text-align: right; margin-left: 0.8em; }
    </style>

    <div data-role="content">
        <div class="content-primary">
            <div class="ops-head">
                <h2>OpEdSync <span id="opsTaskState" class="ops-badge">…</span></h2>
                <button is="emby-button" type="button" id="opsRun" class="raised emby-button">
                    <span data-ops-t="runNow"></span>
                </button>
            </div>

            <div class="ops-cards">
                <div class="ops-card">
                    <p class="ops-card-label" data-ops-t="coverage"></p>
                    <p class="ops-card-value" id="opsCoverage">—</p>
                    <p class="ops-card-sub" id="opsCoverageSub"></p>
                    <div class="ops-bar"><div id="opsCoverageBar"></div></div>
                </div>
                <div class="ops-card">
                    <p class="ops-card-label" data-ops-t="withoutTheme"></p>
                    <p class="ops-card-value" id="opsMissing">—</p>
                    <p class="ops-card-sub" id="opsFromPlugin"></p>
                </div>
                <div class="ops-card">
                    <p class="ops-card-label" data-ops-t="lastRun"></p>
                    <p class="ops-card-value" id="opsLastAdded">—</p>
                    <p class="ops-card-sub" id="opsLastRunSub"></p>
                </div>
                <div class="ops-card">
                    <p class="ops-card-label" data-ops-t="nextRun"></p>
                    <p class="ops-card-value" id="opsNextRun">—</p>
                    <p class="ops-card-sub" id="opsNextRunSub"></p>
                </div>
            </div>

            <div class="ops-section">
                <h3 data-ops-t="whyMissing"></h3>
                <div id="opsReasons"></div>
                <details id="opsMissingDetails">
                    <summary data-ops-t="showList"></summary>
                    <ul class="ops-missing" id="opsMissingList"></ul>
                </details>
            </div>

            <form id="OpEdSyncConfigForm">
                <div class="ops-section">
                    <h3 data-ops-t="libraries"></h3>
                    <div class="fieldDescription" data-ops-t="librariesHelp"></div>
                    <div id="opsLibraries"></div>
                </div>

                <div class="ops-section">
                    <h3 data-ops-t="music"></h3>
                    <div class="selectContainer">
                        <label class="selectLabel" for="opsAudioFetch" data-ops-t="themesToKeep"></label>
                        <select is="emby-select" id="opsAudioFetch">
                            <option value="Single" data-ops-t="fetchSingle"></option>
                            <option value="All" data-ops-t="fetchAll"></option>
                            <option value="None" data-ops-t="fetchNone"></option>
                        </select>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="opsThemeSource" data-ops-t="seriesUse"></label>
                        <select is="emby-select" id="opsThemeSource">
                            <option value="LatestSeason" data-ops-t="latestSeason"></option>
                            <option value="Series" data-ops-t="firstSeason"></option>
                        </select>
                        <div class="fieldDescription" data-ops-t="seriesUseHelp"></div>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="opsThemeTypes" data-ops-t="themeTypes"></label>
                        <select is="emby-select" id="opsThemeTypes">
                            <option value="both" data-ops-t="typesBoth"></option>
                            <option value="op" data-ops-t="typesOp"></option>
                            <option value="ed" data-ops-t="typesEd"></option>
                        </select>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="opsAudioOverlap" data-ops-t="overlap"></label>
                        <select is="emby-select" id="opsAudioOverlap">
                            <option value="transitions" data-ops-t="overlapTransitions"></option>
                            <option value="strict" data-ops-t="overlapStrict"></option>
                            <option value="all" data-ops-t="overlapAll"></option>
                        </select>
                        <div class="fieldDescription" data-ops-t="overlapHelp"></div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="opsAudioVolume" data-ops-t="volume"></label>
                        <div class="ops-volume">
                            <input id="opsAudioVolume" type="range" min="0" max="100" step="5"/>
                            <output id="opsAudioVolumeOut"></output>
                        </div>
                        <div class="fieldDescription" data-ops-t="volumeHelp"></div>
                    </div>
                </div>

                <div class="ops-section">
                    <details id="opsVideoDetails">
                        <summary><h3 style="display: inline;" data-ops-t="video"></h3> <span id="opsVideoState" class="ops-badge"></span></summary>
                        <div class="fieldDescription" data-ops-t="videoHelp"></div>
                        <div class="selectContainer">
                            <label class="selectLabel" for="opsVideoFetch" data-ops-t="themesToKeep"></label>
                            <select is="emby-select" id="opsVideoFetch">
                                <option value="None" data-ops-t="fetchNone"></option>
                                <option value="Single" data-ops-t="fetchSingle"></option>
                                <option value="All" data-ops-t="fetchAll"></option>
                            </select>
                        </div>
                        <div class="selectContainer">
                            <label class="selectLabel" for="opsVideoOverlap" data-ops-t="overlap"></label>
                            <select is="emby-select" id="opsVideoOverlap">
                                <option value="transitions" data-ops-t="overlapTransitions"></option>
                                <option value="strict" data-ops-t="overlapStrict"></option>
                                <option value="all" data-ops-t="overlapAll"></option>
                            </select>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="opsVideoCredits" type="checkbox" is="emby-checkbox"/>
                                <span data-ops-t="noCredits"></span>
                            </label>
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="opsVideoVolume" data-ops-t="volume"></label>
                            <div class="ops-volume">
                                <input id="opsVideoVolume" type="range" min="0" max="100" step="5"/>
                                <output id="opsVideoVolumeOut"></output>
                            </div>
                            <div class="fieldDescription" data-ops-t="videoVolumeHelp"></div>
                        </div>
                    </details>
                </div>

                <div class="ops-section">
                    <h3 data-ops-t="advanced"></h3>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="opsCheckYear" type="checkbox" is="emby-checkbox"/>
                            <span data-ops-t="checkYear"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-ops-t="checkYearHelp"></div>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="opsParallelism" data-ops-t="parallelism"></label>
                        <select is="emby-select" id="opsParallelism">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                        <div class="fieldDescription" data-ops-t="parallelismHelp"></div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="opsForceSync" type="checkbox" is="emby-checkbox"/>
                            <span class="ops-danger" data-ops-t="forceSync"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-ops-t="forceSyncHelp"></div>
                    </div>
                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span data-ops-t="save"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            'use strict';

            var pluginId = 'c99b0ba5-9cbf-4ee0-b45f-40873c6b5b0b';
            var taskKey = 'opedsync.search';
            var page = document.querySelector('#OpEdSyncConfigPage');

            var texts = {
                fr: {
                    runNow: 'Lancer maintenant', coverage: 'Couverture', withoutTheme: 'Sans thème', lastRun: 'Dernier passage',
                    nextRun: 'Prochain passage', whyMissing: 'Pourquoi ces séries et films n\'ont pas de thème',
                    showList: 'Voir la liste', libraries: 'Bibliothèques',
                    librariesHelp: 'Cochez seulement vos bibliothèques d\'anime : ailleurs, de mauvais identifiants donneraient de mauvais thèmes.',
                    music: 'Musique de thème', themesToKeep: 'Thèmes à télécharger', fetchSingle: 'Un seul (le meilleur)',
                    fetchAll: 'Tous', fetchNone: 'Aucun', seriesUse: 'Pour les séries, utiliser', latestSeason: 'La dernière saison',
                    firstSeason: 'La série (en général la saison 1)',
                    seriesUseHelp: 'Avec la dernière saison, le plugin passe à la saison précédente si AnimeThemes n\'a rien pour elle.',
                    themeTypes: 'Openings et endings', typesBoth: 'Les deux', typesOp: 'Openings seulement', typesEd: 'Endings seulement',
                    overlap: 'Génériques qui débordent sur l\'épisode', overlapTransitions: 'Accepter les simples transitions',
                    overlapStrict: 'Génériques propres seulement', overlapAll: 'Tout accepter',
                    overlapHelp: 'Une transition ajoute quelques secondes de l\'épisode au début ou à la fin. Une version propre est toujours préférée.',
                    volume: 'Volume', volumeHelp: 'Appliqué dans le fichier. Un changement est pris en compte au passage suivant.',
                    video: 'Vidéo de thème', videoHelp: 'Fond animé sur la page de la série. Prend beaucoup de place sur le disque.',
                    noCredits: 'Sans crédits à l\'écran', videoVolumeHelp: 'À 0 %, la piste audio est retirée.',
                    advanced: 'Avancé', checkYear: 'Vérifier l\'année de sortie',
                    checkYearHelp: 'Ignore un animé dont l\'année diffère de plus d\'un an de celle du média : écarte la plupart des identifiants erronés.',
                    parallelism: 'Téléchargements simultanés', parallelismHelp: '1 suffit et ménage le serveur d\'AnimeThemes.',
                    forceSync: 'Remplacer les thèmes existants à chaque passage',
                    forceSyncHelp: 'Retélécharge et supprime les thèmes du plugin qui ne correspondent plus aux réglages. Vos propres fichiers (theme.mp3) ne sont jamais touchés.',
                    save: 'Enregistrer', on: 'activée', off: 'désactivée', idle: 'Prêt', running: 'En cours', series: 'séries et films',
                    fromPlugin: 'dont {0} posés par OpEdSync', never: 'jamais', failed: 'échec(s)', ago: 'il y a {0}',
                    every: 'toutes les {0}', manual: 'manuel', soon: 'bientôt', noMissing: 'Tous les médias ont un thème.',
                    noLibrary: 'Aucune bibliothèque cochée : le plugin ne fait rien.', cancelled: 'interrompu',
                    unit_m: '{0} min', unit_h: '{0} h', unit_d: '{0} j',
                    reasons: {
                        NoId: 'Aucun identifiant AniDB, MyAnimeList ou AniList', NotOnAnimeThemes: 'Absent d\'AnimeThemes',
                        NoVideo: 'Sur AnimeThemes, mais sans vidéo pour l\'instant', YearMismatch: 'Écarté : année trop éloignée',
                        Filtered: 'Écarté par les réglages (openings, endings, débordements)', DownloadFailed: 'Échec du téléchargement',
                        LookupFailed: 'AnimeThemes injoignable au dernier passage', NotAnalysed: 'Pas encore analysé (lancez un passage)'
                    }
                },
                en: {
                    runNow: 'Run now', coverage: 'Coverage', withoutTheme: 'Without theme', lastRun: 'Last run',
                    nextRun: 'Next run', whyMissing: 'Why these series and movies have no theme',
                    showList: 'Show the list', libraries: 'Libraries',
                    librariesHelp: 'Only tick your anime libraries: elsewhere, wrong IDs would give wrong themes.',
                    music: 'Theme music', themesToKeep: 'Themes to download', fetchSingle: 'One (the best)',
                    fetchAll: 'All', fetchNone: 'None', seriesUse: 'For series, use', latestSeason: 'The latest season',
                    firstSeason: 'The series (usually season 1)',
                    seriesUseHelp: 'With the latest season, the plugin falls back to the previous season when AnimeThemes has nothing for it.',
                    themeTypes: 'Openings and endings', typesBoth: 'Both', typesOp: 'Openings only', typesEd: 'Endings only',
                    overlap: 'Themes that overlap with the episode', overlapTransitions: 'Accept simple transitions',
                    overlapStrict: 'Clean themes only', overlapAll: 'Accept everything',
                    overlapHelp: 'A transition adds a few seconds of the episode at the start or the end. A clean version is always preferred.',
                    volume: 'Volume', volumeHelp: 'Baked into the file. A change applies on the next run.',
                    video: 'Theme video', videoHelp: 'Animated background on the series page. Takes a lot of disk space.',
                    noCredits: 'Without on-screen credits', videoVolumeHelp: 'At 0 %, the audio track is removed.',
                    advanced: 'Advanced', checkYear: 'Check the release year',
                    checkYearHelp: 'Ignores an anime whose year is more than one year away from the media\'s: rules out most wrong IDs.',
                    parallelism: 'Simultaneous downloads', parallelismHelp: '1 is enough and spares the AnimeThemes server.',
                    forceSync: 'Replace existing themes on every run',
                    forceSyncHelp: 'Downloads again and removes the plugin\'s themes that no longer match the settings. Your own files (theme.mp3) are never touched.',
                    save: 'Save', on: 'on', off: 'off', idle: 'Ready', running: 'Running', series: 'series and movies',
                    fromPlugin: '{0} of them from OpEdSync', never: 'never', failed: 'failed', ago: '{0} ago',
                    every: 'every {0}', manual: 'manual', soon: 'soon', noMissing: 'Every item has a theme.',
                    noLibrary: 'No library ticked: the plugin does nothing.', cancelled: 'cancelled',
                    unit_m: '{0} min', unit_h: '{0} h', unit_d: '{0} d',
                    reasons: {
                        NoId: 'No AniDB, MyAnimeList or AniList ID', NotOnAnimeThemes: 'Not on AnimeThemes',
                        NoVideo: 'On AnimeThemes, but no video yet', YearMismatch: 'Ruled out: release year too far',
                        Filtered: 'Ruled out by the settings (openings, endings, overlaps)', DownloadFailed: 'Download failed',
                        LookupFailed: 'AnimeThemes unreachable on the last run', NotAnalysed: 'Not analysed yet (start a run)'
                    }
                }
            };

            // Jellyfin sets <html lang> to the display language: French texts for French, English for every other language.
            var lang = (document.documentElement.getAttribute('lang') || navigator.language || 'en').toLowerCase();
            var isFrench = lang === 'fr' || lang.indexOf('fr-') === 0;
            var t = isFrench ? texts.fr : texts.en;
            var locale = isFrench ? 'fr' : 'en';

            var config = {};
            var task = null;
            var pollTimer = null;

            function $(selector) {
                return page.querySelector(selector);
            }

            function format(text, value) {
                return text.replace('{0}', value);
            }

            function number(value) {
                return Number(value || 0).toLocaleString(locale);
            }

            function escapeHtml(value) {
                var div = document.createElement('div');
                div.textContent = value == null ? '' : String(value);
                return div.innerHTML;
            }

            function duration(ms) {
                var minutes = Math.max(1, Math.round(ms / 60000));
                if (minutes < 60) {
                    return format(t.unit_m, minutes);
                }

                var hours = Math.round(minutes / 60);
                return hours < 48 ? format(t.unit_h, hours) : format(t.unit_d, Math.round(hours / 24));
            }

            function translatePage() {
                var nodes = page.querySelectorAll('[data-ops-t]');
                for (var i = 0; i < nodes.length; i++) {
                    var key = nodes[i].getAttribute('data-ops-t');
                    if (t[key] !== undefined) {
                        nodes[i].textContent = t[key];
                    }
                }
            }

            function overlapValue(settings) {
                if (!settings.IgnoreOverlapping) {
                    return 'all';
                }

                return settings.AllowTransitions === false ? 'strict' : 'transitions';
            }

            function applyOverlap(settings, value) {
                settings.IgnoreOverlapping = value !== 'all';
                settings.AllowTransitions = value !== 'strict';
            }

            function showVolume(input, output) {
                output.textContent = input.value + ' %';
            }

            function writeForm() {
                var audio = config.AudioSettings;
                var video = config.VideoSettings;

                $('#opsAudioFetch').value = audio.FetchType;
                $('#opsThemeSource').value = config.ThemeSource || 'LatestSeason';
                $('#opsThemeTypes').value = audio.IgnoreEDs ? 'op' : (audio.IgnoreOPs ? 'ed' : 'both');
                $('#opsAudioOverlap').value = overlapValue(audio);
                $('#opsAudioVolume').value = Math.round((audio.Volume || 0) * 100);
                showVolume($('#opsAudioVolume'), $('#opsAudioVolumeOut'));

                $('#opsVideoFetch').value = video.FetchType;
                $('#opsVideoOverlap').value = overlapValue(video);
                $('#opsVideoCredits').checked = !!video.IgnoreThemesWithCredits;
                $('#opsVideoVolume').value = Math.round((video.Volume || 0) * 100);
                showVolume($('#opsVideoVolume'), $('#opsVideoVolumeOut'));
                $('#opsVideoState').textContent = video.FetchType === 'None' ? t.off : t.on;

                $('#opsCheckYear').checked = config.CheckYear !== false;
                $('#opsParallelism').value = String(Math.min(4, Math.max(1, parseInt(config.DegreeOfParallelism, 10) || 1)));
                $('#opsForceSync').checked = !!config.ForceSync;
            }

            function readForm() {
                var audio = config.AudioSettings;
                var video = config.VideoSettings;
                var types = $('#opsThemeTypes').value;

                audio.FetchType = $('#opsAudioFetch').value;
                audio.IgnoreOPs = video.IgnoreOPs = types === 'ed';
                audio.IgnoreEDs = video.IgnoreEDs = types === 'op';
                applyOverlap(audio, $('#opsAudioOverlap').value);
                audio.Volume = parseInt($('#opsAudioVolume').value, 10) / 100;

                video.FetchType = $('#opsVideoFetch').value;
                applyOverlap(video, $('#opsVideoOverlap').value);
                video.IgnoreThemesWithCredits = $('#opsVideoCredits').checked;
                video.Volume = parseInt($('#opsVideoVolume').value, 10) / 100;

                config.ThemeSource = $('#opsThemeSource').value;
                config.CheckYear = $('#opsCheckYear').checked;
                config.DegreeOfParallelism = parseInt($('#opsParallelism').value, 10);
                config.ForceSync = $('#opsForceSync').checked;

                var boxes = page.querySelectorAll('#opsLibraries input[type=checkbox]');
                var ids = [];
                for (var i = 0; i < boxes.length; i++) {
                    if (boxes[i].checked) {
                        ids.push(boxes[i].getAttribute('data-id'));
                    }
                }

                config.UseLibraryList = true;
                config.LibraryIds = ids;
            }

            function renderLibraries(libraries) {
                var html = '';
                for (var i = 0; i < libraries.length; i++) {
                    var library = libraries[i];
                    html += '<div class="checkboxContainer"><label class="emby-checkbox-label">'
                        + '<input type="checkbox" is="emby-checkbox" data-id="' + escapeHtml(library.Id) + '"' + (library.Included ? ' checked' : '') + '/>'
                        + '<span>' + escapeHtml(library.Name) + '</span></label></div>';
                }

                $('#opsLibraries').innerHTML = html;
            }

            function renderStats(stats) {
                var total = stats.Total || 0;
                var withTheme = stats.WithTheme || 0;
                var missing = total - withTheme;
                var percent = total ? Math.round(withTheme / total * 100) : 0;

                $('#opsCoverage').textContent = total ? percent + ' %' : '—';
                $('#opsCoverageSub').textContent = number(withTheme) + ' / ' + number(total) + ' ' + t.series;
                $('#opsCoverageBar').style.width = percent + '%';
                $('#opsMissing').textContent = number(missing);
                $('#opsFromPlugin').textContent = format(t.fromPlugin, number(stats.FromPlugin));

                var run = stats.LastRun;
                if (run) {
                    var ended = new Date(run.EndedUtc);
                    $('#opsLastAdded').textContent = '+' + number(run.Added);
                    $('#opsLastRunSub').textContent = format(t.ago, duration(Date.now() - ended.getTime()))
                        + ' · ' + number(run.Failed) + ' ' + t.failed + (run.Cancelled ? ' · ' + t.cancelled : '');
                } else {
                    $('#opsLastAdded').textContent = '—';
                    $('#opsLastRunSub').textContent = t.never;
                }

                var reasons = stats.Reasons || {};
                var order = ['NoId', 'NotOnAnimeThemes', 'NoVideo', 'YearMismatch', 'Filtered', 'DownloadFailed', 'LookupFailed', 'NotAnalysed'];
                var rows = '';
                for (var i = 0; i < order.length; i++) {
                    if (reasons[order[i]]) {
                        rows += '<div class="ops-row"><span>' + escapeHtml(t.reasons[order[i]]) + '</span><span>' + number(reasons[order[i]]) + '</span></div>';
                    }
                }

                var anyLibrary = false;
                for (var k = 0; k < (stats.Libraries || []).length; k++) {
                    anyLibrary = anyLibrary || stats.Libraries[k].Included;
                }

                if (!anyLibrary) {
                    rows = '<p class="ops-danger">' + escapeHtml(t.noLibrary) + '</p>';
                } else if (!rows) {
                    rows = '<p class="ops-muted">' + escapeHtml(t.noMissing) + '</p>';
                }

                $('#opsReasons').innerHTML = rows;

                var list = '';
                var items = stats.Missing || [];
                for (var j = 0; j < items.length; j++) {
                    list += '<li>' + escapeHtml(items[j].Name) + (items[j].Year ? ' (' + items[j].Year + ')' : '')
                        + ' <span class="ops-muted">: ' + escapeHtml(t.reasons[items[j].Reason] || items[j].Reason) + '</span></li>';
                }

                $('#opsMissingList').innerHTML = list;
                $('#opsMissingDetails').style.display = items.length ? '' : 'none';
            }

            function renderTask() {
                var state = $('#opsTaskState');
                if (!task) {
                    state.textContent = '—';
                    return;
                }

                var running = task.State === 'Running';
                var progress = Math.round(task.CurrentProgressPercentage || 0);
                state.textContent = running ? t.running + ' · ' + progress + ' %' : t.idle;
                state.className = 'ops-badge' + (running ? ' ops-running' : '');

                var interval = null;
                var triggers = task.Triggers || [];
                for (var i = 0; i < triggers.length; i++) {
                    if (triggers[i].Type === 'IntervalTrigger' && triggers[i].IntervalTicks) {
                        interval = triggers[i].IntervalTicks / 10000;
                    }
                }

                var last = task.LastExecutionResult;
                if (running) {
                    $('#opsNextRun').textContent = progress + ' %';
                    $('#opsNextRunSub').textContent = t.running;
                } else if (interval && last && last.EndTimeUtc) {
                    var remaining = new Date(last.EndTimeUtc).getTime() + interval - Date.now();
                    $('#opsNextRun').textContent = remaining > 60000 ? duration(remaining) : t.soon;
                    $('#opsNextRunSub').textContent = format(t.every, duration(interval));
                } else {
                    $('#opsNextRun').textContent = '—';
                    $('#opsNextRunSub').textContent = interval ? format(t.every, duration(interval)) : t.manual;
                }
            }

            function loadTask() {
                return ApiClient.getScheduledTasks({ isHidden: false }).then(function (tasks) {
                    task = null;
                    for (var i = 0; i < tasks.length; i++) {
                        if (tasks[i].Key === taskKey) {
                            task = tasks[i];
                        }
                    }

                    renderTask();
                    return task;
                });
            }

            function loadStats() {
                return ApiClient.getJSON(ApiClient.getUrl('OpEdSync/Stats')).then(function (stats) {
                    renderLibraries(stats.Libraries || []);
                    renderStats(stats);
                });
            }

            // While the task runs, follow its progress, then refresh the figures once it ends.
            function watchTask() {
                if (pollTimer) {
                    return;
                }

                pollTimer = setInterval(function () {
                    loadTask().then(function (current) {
                        if (!current || current.State !== 'Running') {
                            clearInterval(pollTimer);
                            pollTimer = null;
                            loadStats();
                        }
                    });
                }, 3000);
            }

            page.addEventListener('pageshow', function () {
                translatePage();
                Dashboard.showLoadingMsg();
                Promise.all([
                    ApiClient.getPluginConfiguration(pluginId).then(function (result) {
                        config = result;
                        writeForm();
                    }),
                    loadStats(),
                    loadTask().then(function (current) {
                        if (current && current.State === 'Running') {
                            watchTask();
                        }
                    })
                ]).catch(function (e) {
                    console.error('OpEdSync: configuration page failed to load', e);
                }).then(function () {
                    Dashboard.hideLoadingMsg();
                });
            });

            page.addEventListener('pagehide', function () {
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
            });

            $('#opsAudioVolume').addEventListener('input', function () {
                showVolume(this, $('#opsAudioVolumeOut'));
            });

            $('#opsVideoVolume').addEventListener('input', function () {
                showVolume(this, $('#opsVideoVolumeOut'));
            });

            $('#opsVideoFetch').addEventListener('change', function () {
                $('#opsVideoState').textContent = this.value === 'None' ? t.off : t.on;
            });

            $('#opsRun').addEventListener('click', function () {
                if (!task || task.State === 'Running') {
                    return;
                }

                ApiClient.startScheduledTask(task.Id).then(function () {
                    task.State = 'Running';
                    task.CurrentProgressPercentage = 0;
                    renderTask();
                    watchTask();
                });
            });

            $('#OpEdSyncConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                readForm();
                ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                    return loadStats();
                });
                return false;
            });
        })();
    </script>
</div>
</body>
</html>
